# alarm-agent config for monitor on IG-PRD-02 (HG-Prd-02). Kept outside ~/code/ig_lottery on purpose
# (global documentation rule for this host's services). Live recon 2026-10-02.
# No secrets here — GCHAT_WEBHOOK_URL comes from /etc/alarm-agent/secrets.env.
host_label = "IG-PRD-02"
interval_secs = 30

[alert]
consecutive = 2          # 2 × 30 s before a condition alert fires
repeat_minutes = 60

[jvm]
name = "monitor"
# OpenJDK 17 (el9 package), -jar bin/monitor.jar in /home/hg/monitor
cmdline_contains = ["java", "bin/monitor.jar"]
hsperf_dir = "/tmp/hsperfdata_hg"
heap_warn_pct = 85       # of -Xmx1024M
heap_crit_pct = 95
heap_consecutive = 3     # "used" swings between GC cycles
metaspace_warn_pct = 90  # of -XX:MaxMetaspaceSize from java.rt.vmArgs (0.5.1+); unset = logged, not checked
gc_pause_warn_ms = 1000  # summed GC pause time within one 30 s interval
threads_warn = 1000      # 104 live on 2026-10-02
# jar sha256 → git hash; append `<jar sha256>\t<git>\t<label>` before each restart.
versions_file = "/etc/alarm-agent/versions.tsv"

[service]
units = ["monitor.service"]

# monitor's Dubbo providers (2026-10-28, Rust 0.6.0+; every C++ build rejects [[tcp]], so this file
# cannot go back to the C++ rollback binary). Addresses are ig3.lottery.url / ig3.gfc.url in the jar's
# application-dubbo.properties. Connect-only probe: CRIT after `consecutive` failed ticks, recover on connect.
# Planned gfc-server / lottery-gameserver restarts will fire these, as intended.
[[tcp]]
name = "ssc-dubbo"       # IG-Prd-GS-SSC-1 lottery-gameserver
addr = "172.20.21.245:20882"
timeout_ms = 3000

[[tcp]]
name = "gfc-dubbo"       # IG-Prd-GS-GFC-1 gfc-server
addr = "172.20.21.98:20883"
timeout_ms = 3000
