# IM framework selection. Read by the systemd user instance at session start.
# Written by gnome-chewing-ui/scripts/system-im.sh (IBus + chewing-rs).
# GTK_IM_MODULE is left unset on purpose: on GNOME Wayland GTK talks to the
# Shell directly, and the Shell draws the candidate popup.
QT_IM_MODULE=ibus
XMODIFIERS=@im=ibus
SDL_IM_MODULE=ibus
GLFW_IM_MODULE=ibus
